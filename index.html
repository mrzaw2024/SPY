<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BURMA-LADY.COM</title>

<style>
:root{
    --accent:#e01e5a;
    --accent2:#ff5e8e;
    --accent3:#b0144a;
    --grad:linear-gradient(135deg,#ff2e74 0%,#ff5e8e 55%,#ff9eb4 100%);
    --grad-soft:linear-gradient(135deg,#ffe0ec 0%,#fff0f6 100%);
    --bg:#faf4f7;
    --bg2:#fff9fb;
    --surface:#ffffff;
    --text:#251a21;
    --muted:#8b7b84;
    --border:rgba(224,30,90,.12);
    --border-strong:rgba(224,30,90,.24);
    --shadow-sm:0 2px 12px rgba(200,40,90,.06);
    --shadow-md:0 14px 34px rgba(200,40,90,.13);
    --shadow-lg:0 30px 70px rgba(200,40,90,.2);
    --radius-sm:14px;
    --radius:20px;
    --radius-lg:28px;
    --radius-xl:36px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:
        radial-gradient(1100px 600px at 100% -10%,#ffe1ec 0%,transparent 60%),
        radial-gradient(900px 520px at -12% 8%,#fff0f6 0%,transparent 55%),
        linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
    background-attachment:fixed;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
a:focus-visible{
    outline:3px solid rgba(224,30,90,.35);
    outline-offset:2px;
}

::selection{
    background:var(--accent);
    color:#fff;
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
        scroll-behavior:auto !important;
    }
}

/* =========================
   AGE GATE
========================= */

.age-overlay{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:
        radial-gradient(900px 600px at 20% 20%,#fff 0,#fff5f8 45%,#fce4ee 100%);
}

.age-card{
    width:100%;
    max-width:520px;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.8);
    border-radius:var(--radius-xl);
    padding:52px 42px;
    text-align:center;
    box-shadow:var(--shadow-lg);
    animation:ageIn .5s cubic-bezier(.2,.8,.3,1) both;
}

@keyframes ageIn{
    from{
        opacity:0;
        transform:translateY(22px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.age-badge{
    width:74px;
    height:74px;
    margin:0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:24px;
    background:var(--grad);
    color:#fff;
    box-shadow:0 14px 30px rgba(224,30,90,.32);
}

.age-badge svg{
    width:34px;
    height:34px;
}

.age-card h1{
    color:var(--accent3);
    font-size:34px;
    margin-bottom:14px;
    font-weight:800;
    letter-spacing:-.5px;
}

.age-card p{
    color:#81737b;
    font-size:17px;
    line-height:1.7;
    margin-bottom:30px;
}

.age-btn{
    width:100%;
    border:0;
    border-radius:18px;
    padding:18px 20px;
    color:#fff;
    font-size:17px;
    font-weight:800;
    letter-spacing:.4px;
    background:var(--grad);
    background-size:150% 150%;
    box-shadow:0 16px 34px rgba(224,30,90,.32);
    transition:transform .18s ease,box-shadow .18s ease;
}

.age-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 40px rgba(224,30,90,.4);
}

.age-btn:active{
    transform:scale(.98);
}

.age-decline{
    margin-top:18px;
    border:0;
    background:none;
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    padding:6px;
    transition:color .15s;
}

.age-decline:hover{
    color:var(--accent);
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

.page{
    width:100%;
    max-width:820px;
    margin:auto;
    padding-bottom:120px;
}

/* =========================
   HEADER
========================= */

.header{
    padding:34px 16px 22px;
    text-align:center;
}

.logo{
    display:inline-flex;
    align-items:center;
    gap:13px;
    margin:0 auto 10px;
    padding:13px 26px;
    border-radius:var(--radius-lg);
    background:rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--shadow-md);
}

.logo-mark{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:var(--grad);
    box-shadow:0 10px 22px rgba(224,30,90,.3);
    flex:none;
}

.logo-mark svg{
    width:22px;
    height:22px;
}

.logo h1{
    background:var(--grad);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    font-size:24px;
    letter-spacing:.4px;
    font-weight:850;
    text-align:center;
    line-height:1;
    white-space:nowrap;
}

.tagline{
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    letter-spacing:2.4px;
    text-transform:uppercase;
    margin-bottom:24px;
}

.search-box{
    position:relative;
    max-width:560px;
    margin:0 auto;
}

.search-box .search-icon{
    position:absolute;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    color:var(--muted);
    pointer-events:none;
}

.search-box input{
    width:100%;
    border:1px solid var(--border);
    background:rgba(255,255,255,.9);
    outline:none;
    border-radius:20px;
    padding:18px 22px 18px 56px;
    font-size:16px;
    color:var(--text);
    box-shadow:var(--shadow-sm);
    transition:border-color .18s,box-shadow .18s;
}

.search-box input::placeholder{
    color:#a4959d;
}

.search-box input:focus{
    border-color:var(--border-strong);
    box-shadow:0 0 0 4px rgba(224,30,90,.08),var(--shadow-sm);
}

/* =========================
   CATEGORY
========================= */

.categories{
    display:flex;
    gap:12px;
    padding:22px 16px 10px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    min-width:128px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.8);
    border-radius:16px;
    padding:14px 22px;
    color:#82757d;
    font-size:15px;
    font-weight:750;
    text-align:center;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease,color .18s ease;
}

.category:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-sm);
}

.category.active{
    color:#fff;
    border-color:transparent;
    background:var(--grad);
    box-shadow:0 12px 26px rgba(224,30,90,.28);
}

/* =========================
   CONTENT
========================= */

.content{
    padding:6px 16px 30px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:23px;
    margin:26px 0 18px;
    font-weight:800;
    letter-spacing:-.3px;
}

.section-title::before{
    content:"";
    width:5px;
    height:22px;
    border-radius:8px;
    background:var(--grad);
    box-shadow:0 4px 12px rgba(224,30,90,.35);
}

/* =========================
   VIDEO CARD
========================= */

.video-card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    overflow:hidden;
    border:1px solid var(--border);
    box-shadow:var(--shadow-md);
    margin-bottom:26px;
    transition:transform .22s ease,box-shadow .22s ease;
    animation:cardIn .45s ease both;
}

.video-card:nth-child(2){
    animation-delay:.05s;
}

.video-card:nth-child(3){
    animation-delay:.1s;
}

.video-card:nth-child(4){
    animation-delay:.15s;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(16px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.video-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-lg);
}

.thumbnail-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#ece2e8;
    overflow:hidden;
}

.thumbnail{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .45s ease;
}

.thumbnail-wrap:hover .thumbnail{
    transform:scale(1.05);
}

.thumb-shade{
    position:absolute;
    inset:0;
    background:linear-gradient(
        180deg,
        rgba(20,8,14,.25) 0%,
        transparent 35%,
        transparent 60%,
        rgba(20,8,14,.35) 100%
    );
    pointer-events:none;
}

.play-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity .22s ease;
    background:rgba(30,8,18,.12);
}

.thumbnail-wrap:hover .play-overlay,
.thumbnail-wrap:focus-within .play-overlay{
    opacity:1;
}

.play-overlay svg{
    width:64px;
    height:64px;
    color:#fff;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.45));
    transform:scale(.85);
    transition:transform .22s ease;
}

.thumbnail-wrap:hover .play-overlay svg{
    transform:scale(1);
}

.card-top{
    position:absolute;
    top:14px;
    left:14px;
    right:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.link-badge{
    border:0;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    color:var(--accent3);
    padding:11px 15px;
    border-radius:14px;
    font-weight:750;
    font-size:13px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    transition:transform .15s,background .15s;
}

.link-badge svg{
    width:15px;
    height:15px;
}

.link-badge:hover{
    transform:translateY(-1px);
    background:#fff;
}

.favorite-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    color:var(--accent3);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    transition:transform .15s ease,background .18s ease,color .18s ease;
}

.favorite-btn svg{
    width:22px;
    height:22px;
}

.favorite-btn:hover{
    transform:scale(1.08);
}

.favorite-btn.active{
    background:var(--accent);
    color:#fff;
    box-shadow:0 10px 24px rgba(224,30,90,.38);
}

.duration{
    position:absolute;
    right:14px;
    bottom:14px;
    background:rgba(20,8,14,.72);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    color:#fff;
    padding:8px 13px;
    border-radius:11px;
    font-weight:700;
    font-size:13px;
    letter-spacing:.4px;
}

.card-info{
    padding:20px 22px 22px;
}

.card-title{
    font-size:18px;
    line-height:1.45;
    font-weight:800;
    margin-bottom:12px;
    letter-spacing:-.2px;
}

.card-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#8b7d84;
    font-size:14px;
}

.views{
    display:inline-flex;
    gap:7px;
    align-items:center;
}

.views svg{
    width:16px;
    height:16px;
    color:var(--accent2);
}

.quality{
    font-weight:700;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    background:var(--grad-soft);
    color:var(--accent3);
    letter-spacing:.4px;
}

/* =========================
   EMPTY
========================= */

.empty{
    background:rgba(255,255,255,.8);
    border:1.5px dashed #e0a5ba;
    border-radius:var(--radius-lg);
    padding:50px 24px;
    text-align:center;
    color:#96878f;
}

.empty-icon{
    width:64px;
    height:64px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    background:var(--grad-soft);
    color:var(--accent2);
}

.empty-icon svg{
    width:30px;
    height:30px;
}

.empty h3{
    color:var(--text);
    font-size:19px;
    margin-bottom:8px;
}

/* =========================
   DETAIL
========================= */

.detail-page{
    display:none;
    max-width:820px;
    margin:0 auto;
}

.detail-header{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    gap:15px;
    padding:16px;
    background:rgba(255,249,251,.85);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
}

.back-btn{
    width:48px;
    height:48px;
    border-radius:16px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--accent3);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow-sm);
    transition:transform .15s,box-shadow .15s;
}

.back-btn svg{
    width:22px;
    height:22px;
}

.back-btn:hover{
    transform:translateX(-2px);
    box-shadow:var(--shadow-md);
}

.detail-header h2{
    color:var(--accent3);
    font-size:18px;
    font-weight:800;
    letter-spacing:1px;
}

.player{
    background:#000;
    width:100%;
    aspect-ratio:16/9;
    position:relative;
}

.player video,
.player iframe{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
}

.player iframe{
    border:0;
    position:absolute;
    inset:0;
}

.detail-info{
    background:var(--surface);
    padding:30px 22px;
    border-radius:var(--radius-lg);
    margin:18px 16px 0;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--border);
}

.detail-title{
    font-size:23px;
    line-height:1.4;
    margin-bottom:22px;
    letter-spacing:-.3px;
}

.external-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    border:0;
    color:#fff;
    border-radius:16px;
    padding:15px 24px;
    font-weight:800;
    font-size:15px;
    background:var(--grad);
    box-shadow:0 12px 26px rgba(224,30,90,.3);
    transition:transform .15s,box-shadow .15s;
}

.external-btn svg{
    width:18px;
    height:18px;
}

.external-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 32px rgba(224,30,90,.38);
}

.detail-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.copy-btn{
    background:#fff;
    color:var(--accent3);
    border:1.5px solid var(--border-strong);
    box-shadow:var(--shadow-sm);
}

.copy-btn:hover{
    box-shadow:var(--shadow-md);
}

.detail-description{
    margin-top:24px;
    color:#8b7e85;
    line-height:1.75;
    font-size:15px;
}

/* =========================
   PROMO
========================= */

.promo{
    margin:15px 16px 30px;
    background:var(--grad);
    border:0;
    border-radius:var(--radius-lg);
    padding:40px 26px;
    text-align:center;
    color:#fff;
    box-shadow:0 22px 48px rgba(224,30,90,.32);
}

.promo h2{
    margin-bottom:14px;
    font-size:24px;
}

.promo p{
    opacity:.92;
    line-height:1.7;
    margin-bottom:22px;
}

.promo button{
    border:0;
    padding:16px 32px;
    border-radius:16px;
    color:var(--accent3);
    font-weight:800;
    background:#fff;
    box-shadow:0 12px 26px rgba(0,0,0,.16);
    transition:transform .15s;
}

.promo button:hover{
    transform:translateY(-2px);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:1000;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 28px);
    max-width:420px;
    height:74px;
    background:rgba(255,255,255,.9);
    border:1px solid rgba(255,255,255,.95);
    border-radius:26px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:8px;
    box-shadow:0 20px 55px rgba(150,40,85,.24);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
}

.nav-item{
    position:relative;
    flex:1;
    height:100%;
    border:0;
    border-radius:19px;
    background:transparent;
    color:#82747c;
    font-weight:750;
    font-size:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    transition:color .18s,background .18s;
}

.nav-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
}

.nav-icon svg{
    width:24px;
    height:24px;
}

.nav-count{
    position:absolute;
    top:12px;
    right:calc(50% - 30px);
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    font-weight:800;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 12px rgba(224,30,90,.4);
}

.nav-count.show{
    display:flex;
}

.nav-item.active{
    color:var(--accent3);
    background:var(--grad-soft);
}

.nav-item.active .nav-icon svg{
    color:var(--accent);
}

/* =========================
   FAVORITES PAGE
========================= */

.favorites-page{
    display:none;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    z-index:99999;
    left:50%;
    bottom:108px;
    transform:translate(-50%,24px) scale(.96);
    background:rgba(28,12,20,.92);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    color:#fff;
    padding:13px 22px;
    border-radius:16px;
    opacity:0;
    pointer-events:none;
    transition:.28s cubic-bezier(.2,.8,.3,1);
    white-space:nowrap;
    font-size:14px;
    font-weight:600;
    box-shadow:0 16px 40px rgba(20,8,14,.3);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0) scale(1);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:800px){

    .page{
        max-width:960px;
    }

    .detail-page{
        max-width:960px;
    }

    .header{
        padding:40px 30px 26px;
    }

    .content{
        padding:10px 30px 40px;
    }

    .video-grid{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:24px;
    }

    .video-card{
        margin-bottom:0;
    }

    .categories{
        padding-left:30px;
        padding-right:30px;
        justify-content:center;
    }

    .category{
        min-width:150px;
    }

    .detail-info{
        margin:22px 30px 0;
        padding:36px 34px;
    }

    .promo{
        margin-left:30px;
        margin-right:30px;
    }
}

@media(min-width:1200px){

    .video-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:420px){

    .logo h1{
        font-size:19px;
    }

    .logo{
        padding:12px 20px;
    }

    .logo-mark{
        width:38px;
        height:38px;
    }

    .age-card{
        padding:40px 24px;
    }

    .age-card h1{
        font-size:28px;
    }

    .age-card p{
        font-size:15px;
    }

<script>


/* =====================================================
   STORAGE
===================================================== */

const FAVORITE_KEY = "general_video_favorites_v1";
const AGE_KEY = "general_video_age_verified_v1";
const VIEWS_KEY = "general_video_views_v1";
const SHEET_ID = "1Rhuj-gesTt0i03zaM2bEbVfb-rnzfMi4SiQCC3Z3xQ8";
const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID + "/export?format=csv&gid=0";
const SHEET_CACHE_KEY = "general_video_sheet_cache_v1";


/* =====================================================
   DEFAULT DATA
===================================================== */

const defaultVideos = [

    {
        id: 1,
        title: "Sample Travel & Lifestyle Video",
        category: "Myanmar",
        thumbnail: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80",
        video: "https://drive.google.com/file/d/1jk4r9vdFmPPrR110Lcw3Wii1sBZ_EYAe/view?usp=drivesdk",
        link: "#",
        duration: "00:30",
        quality: "HD",
        views: 100,
        description: "Sample catalog video. Replace this sample with your own legal video content."
    },

    {
        id: 2,
        title: "Beautiful Nature & Adventure",
        category: "Japanese",
        thumbnail: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1200&q=80",
        video: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
        link: "#",
        duration: "01:20",
        quality: "UltraHD",
        views: 1000,
        description: "Sample video entry for the catalog."
    },

    {
        id: 3,
        title: "Modern City Lifestyle",
        category: "Korean",
        thumbnail: "https://images.unsplash.com/photo-1538485399081-7c897e8c9e3d?auto=format&fit=crop&w=1200&q=80",
        video: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
        link: "#",
        duration: "02:10",
        quality: "HD",
        views: 980,
        description: "Sample video entry."
    }

];


/* =====================================================
   STATE
===================================================== */

let videos = [];
let favorites = [];
let currentCategory = "All";
let viewCounts = {};
let categoryList = ["All"];
let currentDetailLink = "";


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener("DOMContentLoaded", () => {

    setupSearch();

    loadData();

    checkAge();

});


/* =====================================================
   STORAGE HELPERS
===================================================== */

function readJSON(key, fallback){

    try{

        const raw =
            localStorage.getItem(key);

        return raw
            ? JSON.parse(raw)
            : fallback;

    }catch(error){

        return fallback;

    }

}


function saveJSON(key, value){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    favorites = readJSON(
        FAVORITE_KEY,
        []
    );

    viewCounts = readJSON(
        VIEWS_KEY,
        {}
    );

    await loadSheet();

    buildCategories();

    renderVideos();

    renderFavorites();

    autoFillMetadata();

}


/* =====================================================
   SHEET LOADING
===================================================== */

function parseCSV(text){

    const rows = [];

    let row = [];

    let field = "";

    let inQuotes = false;

    for(let i = 0; i < text.length; i++){

        const ch = text[i];

        if(inQuotes){

            if(ch === '"'){

                if(text[i + 1] === '"'){

                    field += '"';

                    i++;

                }else{

                    inQuotes = false;

                }

            }else{

                field += ch;

            }

        }else if(ch === '"'){

            inQuotes = true;

        }else if(ch === ","){

            row.push(field);

            field = "";

        }else if(ch === "\n"){

            row.push(field);

            rows.push(row);

            row = [];

            field = "";

        }else{

            field += ch;

        }

    }

    if(field.length > 0 || row.length > 0){

        row.push(field);

        rows.push(row);

    }

    return rows.filter(r =>
        r.some(c => String(c).trim() !== "")
    );

}


async function loadSheet(){

    try{

        const cached =
            localStorage.getItem(SHEET_CACHE_KEY);

        if(cached){

            const parsed = JSON.parse(cached);

            if(Array.isArray(parsed) && parsed.length){

                videos = parsed;

            }

        }


        const response =
            await fetch(SHEET_URL, {
                cache:"no-store"
            });

        if(!response.ok) throw new Error("sheet");

        const text =
            await response.text();

        const rows = parseCSV(text);

        if(rows.length > 1){

            const headers =
                rows[0].map(h => h.trim());

            const colMap = {};

            headers.forEach((h,i) => {
                colMap[h] = i;
            });

            const parsedVideos =
                rows.slice(1).map((row,index) => {

                    const get = name => {
                        const col = colMap[name];
                        return col !== undefined
                            ? (row[col] || "").trim()
                            : "";
                    };

                    return {
                        id: index + 1,
                        title: get("Title") || "Untitled",
                        video: toVideoSrc(get("Video Url")),
                        link: get("External Link") || "#",
                        thumbnail: get("Thumbnail URL"),
                        category: get("Category") || "Other",
                        quality: get("Quality") || "HD",
                        duration: get("Duration"),
                        views: parseInt(get("Views"),10) || 0,
                        description: get("Description"),
                        outerSite: get("Outher Site")
                    };

                }).filter(v =>
                    v.video ||
                    v.outerSite ||
                    v.title !== "Untitled"
                );

            if(parsedVideos.length){

                videos = parsedVideos;

                localStorage.setItem(
                    SHEET_CACHE_KEY,
                    JSON.stringify(parsedVideos)
                );

            }

        }

    }catch(error){

        // keep cached or fall back to defaults

    }


    if(!videos.length){

        videos = [...defaultVideos];

    }

}


/* =====================================================
   VIEW COUNTING
===================================================== */

function getViews(video){

    const base =
        parseInt(video.views,10) || 0;

    const extra =
        viewCounts[video.id] || 0;

    return base + extra;

}


function formatViews(count){

    if(count >= 1000000){

        const m =
            (count / 1000000).toFixed(1)
                .replace(/\.0$/,"");

        return m + "M";

    }

    if(count >= 1000){

        const k =
            (count / 1000).toFixed(1)
                .replace(/\.0$/,"");

        return k + "K";

    }

    return String(count);

}


function recordView(id){

    viewCounts[id] =
        (viewCounts[id] || 0) + 1;

    saveJSON(VIEWS_KEY, viewCounts);

}


/* =====================================================
   AUTO METADATA (thumbnail + duration)
===================================================== */

function autoFillMetadata(){

    videos.forEach((video,index) => {

        if(
            video.video &&
            (!video.thumbnail || !video.duration)
        ){

            setTimeout(
                () => ensureMetadata(video),
                index * 500
            );

        }

    });

}


function ensureMetadata(video){

    const probe =
        document.createElement("video");

    probe.muted = true;

    probe.playsInline = true;

    probe.preload = "metadata";

    probe.crossOrigin = "anonymous";

    probe.src = toVideoSrc(video.video);

    probe.onloadedmetadata = () => {

        if(!video.duration){

            video.duration =
                formatDuration(probe.duration);

        }

        if(!video.thumbnail){

            try{

                const target =
                    Math.min(1, probe.duration * 0.1);

                probe.currentTime =
                    Math.max(0.1, target);

            }catch(error){}

        }

        renderVideos();

    };

    probe.onseeked = () => {

        try{

            const canvas =
                document.createElement("canvas");

            canvas.width = 640;

            canvas.height = 360;

            canvas
                .getContext("2d")
                .drawImage(probe,0,0,640,360);

            video.thumbnail =
                canvas.toDataURL("image/jpeg",0.75);

            renderVideos();

        }catch(error){

            video.thumbnail = "";

        }

    };

    probe.onerror = () => {};

}


function formatDuration(seconds){

    if(
        !isFinite(seconds) ||
        seconds <= 0
    ) return "00:00";

    const h = Math.floor(seconds / 3600);

    const m = Math.floor((seconds % 3600) / 60);

    const s = Math.floor(seconds % 60);

    const mm = String(m).padStart(2,"0");

    const ss = String(s).padStart(2,"0");

    return h > 0
        ? `${h}:${mm}:${ss}`
        : `${mm}:${ss}`;

}


/* =====================================================
   AGE
===================================================== */

function checkAge(){

    const verified =
        localStorage.getItem(AGE_KEY);

    if(verified === "true"){

        document.getElementById("ageOverlay").style.display = "none";

        document.getElementById("app").style.display = "block";

    }

}


function agreeAge(){

    localStorage.setItem(AGE_KEY,"true");

    document.getElementById("ageOverlay").style.display = "none";

    document.getElementById("app").style.display = "block";

}


function declineAge(){

    const cardText =
        document.querySelector(".age-card p");

    cardText.textContent =
        "Sorry, this content is only available to adults aged 18 and over.";

    const declineBtn =
        document.querySelector(".age-decline");

    declineBtn.style.display = "none";

}


/* =====================================================
   SEARCH
===================================================== */

function setupSearch(){

    const input =
        document.getElementById("searchInput");

    input.addEventListener(
        "input",
        () => renderVideos()
    );

}


/* =====================================================
   CATEGORY
===================================================== */

function buildCategories(){

    categoryList = [
        "All",
        ...new Set(
            videos
                .map(v => v.category || "Other")
                .filter(Boolean)
        )
    ];

    const container =
        document.getElementById("categories");

    container.innerHTML =
        categoryList.map((cat,index) => `

            <button
                class="category${index === 0 ? " active" : ""}"
                onclick="selectCategory(this,${index})">

                ${escapeHtml(cat === "All" ? "Trending" : cat)}

            </button>

        `).join("");

}


function selectCategory(button,index){

    document
        .querySelectorAll(".category")
        .forEach(item =>
            item.classList.remove("active")
        );

    button.classList.add("active");

    currentCategory =
        categoryList[index];

    const title =
        document.getElementById("homeTitle");

    title.textContent =
        currentCategory === "All"
            ? "Trending"
            : currentCategory;

    renderVideos();

}


/* =====================================================
   FILTER
===================================================== */

function getFilteredVideos(){

    const search =
        document.getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    return videos.filter(video => {

        const categoryMatch =
            currentCategory === "All" ||
            video.category === currentCategory;

        const searchMatch =
            !search ||
            video.title.toLowerCase().includes(search);

        return categoryMatch && searchMatch;

    });

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(){

    const grid =
        document.getElementById("videoGrid");

    const list =
        getFilteredVideos();

    if(!list.length){

        grid.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                </div>
                <h3>No videos found</h3>
                <p style="margin-top:8px">Try another search or category.</p>
            </div>
        `;

        return;

    }

    grid.innerHTML =
        list
            .map(video => createCard(video))
            .join("");

}


/* =====================================================
   VIDEO CARD
===================================================== */

function createCard(video){

    const isFavorite =
        favorites.includes(video.id);

    const thumb =
        video.thumbnail ||
        "https://placehold.co/1200x675/fce7ef/ba245c?text=Video";

    const views =
        formatViews(
            getViews(video)
        );

    const hasOuterSite =
        video.outerSite &&
        video.outerSite !== "#";

    return `

        <article class="video-card">

            <div
                class="thumbnail-wrap"
                onclick="openDetail(${video.id})"
                role="button"
                tabindex="0"
                onkeydown="if(event.key==='Enter')openDetail(${video.id})"
                style="cursor:pointer">

                <img
                    class="thumbnail"
                    src="${escapeAttr(thumb)}"
                    alt="${escapeAttr(video.title)}"
                    loading="lazy"
                    onerror="this.src='https://placehold.co/1200x675/fce7ef/ba245c?text=Video'">

                <span class="thumb-shade"></span>

                <span class="play-overlay">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5.14v13.72c0 .8.87 1.3 1.56.88l10.4-6.86a1.05 1.05 0 000-1.76L9.56 4.26A1.05 1.05 0 008 5.14z"/>
                    </svg>
                </span>

                <div class="card-top">

                    ${
                        hasOuterSite
                        ? `
                            <button
                                class="link-badge"
                                title="Open outer site"
                                onclick="event.stopPropagation();openOuterSite('${escapeAttr(video.outerSite)}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                                    <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                                </svg>
                                Outer Site
                            </button>
                        `
                        : `
                            <button
                                class="link-badge"
                                title="Copy link"
                                onclick="event.stopPropagation();openExternal('${escapeAttr(video.link || "#")}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                                    <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                                </svg>
                                Copy Link
                            </button>
                        `
                    }

                    <button
                        class="favorite-btn ${isFavorite ? "active" : ""}"
                        title="Favorite"
                        onclick="event.stopPropagation();toggleFavorite(${video.id})">
                        ${
                            isFavorite
                            ? `
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                </svg>
                            `
                            : `
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
                                </svg>
                            `
                        }
                    </button>

                </div>


                <div class="duration">
                    ${escapeHtml(video.duration || "00:00")}
                </div>

            </div>


            <div class="card-info">

                <h3 class="card-title">
                    ${escapeHtml(video.title)}
                </h3>

                <div class="card-meta">

                    <span class="views">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        ${views} Views
                    </span>

                    <span class="quality">
                        ${escapeHtml(video.quality || "HD")}
                    </span>

                </div>

            </div>

        </article>

    `;

}


/* =====================================================
   FAVORITES
===================================================== */

function toggleFavorite(id){

    if(favorites.includes(id)){

        favorites =
            favorites.filter(item => item !== id);

        showToast("Removed from favorites");

    }else{

        favorites.push(id);

        showToast("Added to favorites");

    }

    saveJSON(FAVORITE_KEY, favorites);

    renderVideos();

    renderFavorites();

}


function renderFavorites(){

    const grid =
        document.getElementById("favoriteGrid");

    const list =
        videos.filter(video =>
            favorites.includes(video.id)
        );

    if(!list.length){

        grid.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21s-7.5-4.9-10-9.2C.6 8.7 2.3 5 5.9 5c2.2 0 3.5 1.2 4.1 2.2.4-.6 1.3-2.2 4.1-2.2 3.6 0 5.3 3.7 3.9 6.8C19.5 16.1 12 21 12 21z"/>
                    </svg>
                </div>
                <h3>No favorites yet</h3>
                <p style="margin-top:8px">Tap the heart icon on a video to save it here.</p>
            </div>
        `;

        return;

    }

    grid.innerHTML =
        list
            .map(video => createCard(video))
            .join("");

    renderFavoriteCount();

}


function renderFavoriteCount(){

    const badge =
        document.getElementById("favoriteCount");

    badge.textContent =
        favorites.length;

    badge.classList.toggle(
        "show",
        favorites.length > 0
    );

}


/* =====================================================
   DETAIL
===================================================== */

function openDetail(id){

    const video =
        videos.find(item =>
            item.id === id
        );

    if(!video) return;

    recordView(id);

    document.getElementById("homePage").style.display = "none";

    document.getElementById("favoritesPage").style.display = "none";

    document.getElementById("detailPage").style.display = "block";

    const playerWrap =
        document.querySelector(".player");

    const player =
        document.getElementById("detailVideo");

    const iframe =
        document.getElementById("detailIframe");

    const openLink =
        document.getElementById("detailOpenLink");

    const copyBtn =
        document.getElementById("detailCopyLink");

    const hasVideo =
        !!video.video;

    const hasOuterSite =
        video.outerSite &&
        video.outerSite !== "#";

    const type =
        getVideoType(video.video);

    function resetIframe(){

        iframe.style.display = "none";

        iframe.removeAttribute("src");

    }

    function showDetailLink(url){

        if(url){

            const clean =
                normalizeUrl(url);

            openLink.href = clean;

            openLink.style.display = "inline-flex";

            currentDetailLink = clean;

            copyBtn.style.display = "inline-flex";

        }else{

            openLink.href = "#";

            openLink.style.display = "none";

            currentDetailLink = "";

            copyBtn.style.display = "none";

        }

    }

    if(type === "drive" || type === "youtube"){

        playerWrap.style.display = "block";

        player.pause();

        player.removeAttribute("src");

        player.load();

        player.style.display = "none";

        iframe.style.display = "block";

        iframe.src =
            type === "drive"
                ? driveEmbedUrl(video.video)
                : youtubeEmbedUrl(video.video);

        showDetailLink(
            video.link && video.link !== "#"
                ? video.link
                : hasOuterSite
                    ? video.outerSite
                    : ""
        );

    }else if(hasVideo){

        playerWrap.style.display = "block";

        resetIframe();

        player.style.display = "block";

        player.pause();

        player.src =
            toVideoSrc(video.video);

        player.load();

        showDetailLink(
            video.link && video.link !== "#"
                ? video.link
                : hasOuterSite
                    ? video.outerSite
                    : ""
        );


        if(!video.thumbnail){

            player.onloadeddata = () => {

                try{

                    const canvas =
                        document.createElement("canvas");

                    canvas.width = 640;

                    canvas.height = 360;

                    canvas
                        .getContext("2d")
                        .drawImage(player,0,0,640,360);

                    video.thumbnail =
                        canvas.toDataURL("image/jpeg",0.75);

                    renderVideos();

                    renderFavorites();

                }catch(error){}

            };

        }else{

            player.onloadeddata = null;

        }

    }else if(hasOuterSite){

        playerWrap.style.display = "none";

        resetIframe();

        player.pause();

        player.removeAttribute("src");

        player.load();

        showDetailLink(video.outerSite);

    }else{

        playerWrap.style.display = "none";

        resetIframe();

        player.pause();

        player.removeAttribute("src");

        player.load();

        showDetailLink("");

    }


    document.getElementById(
        "detailTitle"
    ).textContent =
        video.title;

    document.getElementById(
        "detailDescription"
    ).textContent =
        video.description || "";

    renderRecommendations(video);

    renderVideos();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function normalizeUrl(url){

    let clean =
        String(url || "").trim();

    if(!/^https?:\/\//i.test(clean)){

        clean =
            "https://" + clean;

    }

    return clean;

}


/* =====================================================
   GOOGLE DRIVE VIDEO SUPPORT
===================================================== */

function extractDriveId(url){

    const text =
        String(url || "");

    let match =
        text.match(/\/file\/d\/([^/]+)/);

    if(match) return match[1];

    match =
        text.match(/[?&]id=([^&]+)/);

    if(match) return match[1];

    match =
        text.match(/^([a-zA-Z0-9_-]{20,})$/);

    return match ? match[1] : null;

}


function toVideoSrc(url){

    if(!url) return "";

    const id =
        extractDriveId(url);

    if(id){

        return (
            "https://drive.google.com/uc?export=download&id=" +
            encodeURIComponent(id)
        );

    }

    return normalizeUrl(url);

}


/* =====================================================
   VIDEO SOURCE TYPE (drive / youtube / direct)
===================================================== */

function getVideoType(url){

    const text =
        String(url || "");

    if(
        /drive\.google\.com/.test(text) ||
        (/^[a-zA-Z0-9_-]{20,}$/.test(text) && !text.includes("."))
    ) return "drive";

    if(
        /youtube\.com/.test(text) ||
        /youtu\.be/.test(text)
    ) return "youtube";

    return text ? "direct" : "none";

}


function extractYoutubeId(url){

    const text =
        String(url || "");

    let match =
        text.match(/[?&]v=([^&#]+)/);

    if(match) return match[1];

    match =
        text.match(/youtu\.be\/([^?#]+)/);

    if(match) return match[1];

    match =
        text.match(/embed\/([^?#]+)/);

    if(match) return match[1];

    return null;

}


function driveEmbedUrl(url){

    const id =
        extractDriveId(url);

    return id
        ? "https://drive.google.com/file/d/" +
            encodeURIComponent(id) + "/preview"
        : "";

}


function youtubeEmbedUrl(url){

    const id =
        extractYoutubeId(url);

    return id
        ? "https://www.youtube.com/embed/" +
            encodeURIComponent(id) + "?rel=0"
        : "";

}


/* =====================================================
   CLOSE DETAIL
===================================================== */

function closeDetail(){

    const player =
        document.getElementById("detailVideo");

    const iframe =
        document.getElementById("detailIframe");

    player.pause();

    player.removeAttribute("src");

    player.load();

    player.style.display = "block";

    iframe.removeAttribute("src");

    iframe.style.display = "none";

    document.getElementById(
        "detailPage"
    ).style.display = "none";

    showHome();

}


/* =====================================================
   RECOMMENDATIONS
===================================================== */

function renderRecommendations(current){

    const grid =
        document.getElementById(
            "recommendationGrid"
        );

    let list =
        videos.filter(video =>
            video.id !== current.id &&
            video.category === current.category
        );

    if(list.length < 2){

        list =
            videos.filter(video =>
                video.id !== current.id
            );

    }

    list =
        list.slice(0,6);

    grid.innerHTML =
        list
            .map(video => createCard(video))
            .join("");

}

===================================================== */

function showHome(){

    document.getElementById(
        "homePage"
    ).style.display = "block";

    document.getElementById(
        "favoritesPage"

    document.getElementById(

function showFavorites(){

        "homePage"
    ).style.display = "none";

    document.getElementById(
        "detailPage"
    ).style.display = "none";

    document.getElementById(
        "favoritesPage"
    ).style.display = "block";

    document.getElementById(
        "discoverNav"

    document.getElementById(

    window.scrollTo({
        top:0,

    });

}


/* =====================================================
   EXTERNAL LINKS
===================================================== */

function copyLink(url){

    if(!url || url === "#"){

        showToast("No link to copy");

        return;

    }

    const target =
        normalizeUrl(url);

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard.writeText(target)
            .then(() =>
                showToast("Link copied")
            )
            .catch(() => {

                fallbackCopy(target);

                showToast("Link copied");

            });

    }else{

        fallbackCopy(target);

        showToast("Link copied");

    }

}


function fallbackCopy(text){

    const input =
        document.createElement("textarea");

    input.value = text;

    input.style.position = "fixed";

    input.style.opacity = "0";

    document.body.appendChild(input);

    input.select();

    document.execCommand("copy");

    document.body.removeChild(input);

}


function openExternal(url){

    copyLink(url);

}


function copyDetailLink(){

    copyLink(currentDetailLink);

}


function openOuterSite(url){

    copyLink(url);

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2200);

}


/* =====================================================
   ESCAPE HELPERS
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return String(value ?? "")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
